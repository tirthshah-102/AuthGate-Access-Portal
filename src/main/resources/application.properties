spring.application.name=gatepass

# Database Configuration (File-based H2 Database)
spring.datasource.url=jdbc:h2:file:./gatepassdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Configuration (for debugging database tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Port Configuration
server.port=8080

# Clean Startup Logging Configuration
spring.main.banner-mode=off
logging.level.root=WARN

