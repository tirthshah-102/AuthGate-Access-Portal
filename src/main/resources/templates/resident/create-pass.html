<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Gate Pass - AuthGate</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a th:href="@{/resident/dashboard}" class="navbar-brand">Auth<span>Gate</span></a>
        <div class="navbar-user">
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="max-width: 650px;">
        <div style="margin-bottom: 2rem;">
            <a th:href="@{/resident/dashboard}" class="btn btn-secondary" style="margin-bottom: 1rem; padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                &larr; Back to Dashboard
            </a>
            <h1 style="font-size: 2rem; font-weight: 700;">Generate Gate Pass</h1>
            <p style="color: var(--text-muted);">Fill in guest details. A unique QR code will be generated.</p>
        </div>

        <div class="glass-panel">
            <form th:action="@{/resident/create-pass}" th:object="${gatePass}" method="post">
                <div class="form-group">
                    <label for="visitorName">Guest Full Name *</label>
                    <input type="text" id="visitorName" th:field="*{visitorName}" placeholder="Enter guest name" required>
                    <div class="error-msg" th:if="${#fields.hasErrors('visitorName')}" th:errors="*{visitorName}"></div>
                </div>

                <div class="form-group">
                    <label for="visitorPhone">Guest Phone Number *</label>
                    <input type="tel" id="visitorPhone" th:field="*{visitorPhone}" placeholder="Enter 10-digit number" required>
                    <div class="error-msg" th:if="${#fields.hasErrors('visitorPhone')}" th:errors="*{visitorPhone}"></div>
                </div>

                <div class="form-group">
                    <label for="visitorVehicleNo">Vehicle Number (Optional)</label>
                    <input type="text" id="visitorVehicleNo" th:field="*{visitorVehicleNo}" placeholder="e.g. MH-12-AB-1234">
                    <div class="error-msg" th:if="${#fields.hasErrors('visitorVehicleNo')}" th:errors="*{visitorVehicleNo}"></div>
                </div>

                <div class="form-group">
                    <label for="purpose">Purpose of Visit *</label>
                    <select id="purpose" th:field="*{purpose}" required>
                        <option value="Social Visit">Social Visit / Guest</option>
                        <option value="Delivery">Delivery / Courier</option>
                        <option value="Home Service">Home Service (Plumber, Electrician etc.)</option>
                        <option value="Cab / Taxi">Cab / Taxi Entry</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="error-msg" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></div>
                </div>

                <div class="grid-2col" style="gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group">
                        <label for="validFrom">Active From *</label>
                        <input type="datetime-local" id="validFrom" th:field="*{validFrom}" required>
                        <div class="error-msg" th:if="${#fields.hasErrors('validFrom')}" th:errors="*{validFrom}"></div>
                    </div>

                    <div class="form-group">
                        <label for="validTo">Expires On *</label>
                        <input type="datetime-local" id="validTo" th:field="*{validTo}" required>
                        <div class="error-msg" th:if="${#fields.hasErrors('validTo')}" th:errors="*{validTo}"></div>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <a th:href="@{/resident/dashboard}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Generate Pass & QR</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
